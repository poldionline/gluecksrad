<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Glücksrad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6366f1; --accent-ink:#fff;
  --bg:#f4f5f9; --panel:#ffffff; --panel2:#eef0f6; --line:#e1e4ee;
  --text:#14161f; --muted:#6a7088; --danger:#dc2626; --shadow:0 10px 30px rgba(20,22,40,.08);
  --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1018;--panel:#171a26;--panel2:#1f2332;--line:#2a2f42;--text:#eceef6;--muted:#8b92ab;--danger:#f87171;--shadow:0 10px 30px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden}
body{position:fixed;inset:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
  display:flex}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

aside{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--accent),color-mix(in srgb,var(--accent) 40%,#fff),var(--accent));display:block}
h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:11px 12px;font-weight:600;color:var(--muted);text-align:left}
.nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button em{margin-left:auto;font-style:normal;font-size:12px;background:var(--panel2);color:var(--muted);border-radius:999px;padding:2px 8px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav button.on em{background:var(--accent);color:var(--accent-ink)}
.cur{background:var(--panel2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.cur small{color:var(--muted);font-size:12px}
.cur b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lc{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left}
.lc:hover{border-color:var(--muted)}
.lc.on{border-color:var(--accent);background:var(--accent-soft)}
.lc b{font-size:17px;letter-spacing:-.01em;word-break:break-word}
.lc small{color:var(--muted)}
.lc .tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 9px}
.lc .act{display:flex;gap:6px}
.lc .act button{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.lc .act button:hover{color:var(--text)}
.lc .act button.d:hover{color:var(--danger);border-color:var(--danger)}
.newc{border:2px dashed var(--line);background:none;border-radius:16px;min-height:112px;color:var(--muted);font-weight:800;font-size:16px}
.newc:hover{color:var(--accent);border-color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.sub button{background:none;border:0;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
#vListen,#vSet{flex-direction:column;gap:18px;max-width:820px;width:100%;margin:0 auto}
#vSet .card{display:flex;flex-direction:column;gap:6px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px var(--panel)}
.sw button.on{border-color:var(--text)}
.sw label{width:28px;height:28px;border-radius:50%;overflow:hidden;position:relative;cursor:pointer;background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);box-shadow:inset 0 0 0 2px var(--panel)}
.sw input[type=color]{position:absolute;inset:-10px;opacity:0;width:60px;height:60px;cursor:pointer}
.dur{display:flex;align-items:baseline;justify-content:space-between}
.dur b{font-size:20px;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.4}
.spacer{flex:1}

main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;padding:14px 20px 18px;overflow:auto;display:none}
.view.on{display:flex}

/* Wheel */
#vRad{position:relative;flex-direction:column;align-items:center;gap:14px;justify-content:center}
.stage{position:relative;width:100%;flex:1 1 0;min-height:200px;container-type:size;display:grid;place-items:center}
canvas{display:block;width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;max-width:86%;text-align:center;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 28px;box-shadow:var(--shadow),0 0 0 6px var(--accent-soft);cursor:pointer}
.win:empty{display:none}
.win small{color:var(--muted);font-size:13px}
.win strong{font-size:clamp(24px,4vw,38px);letter-spacing:-.02em;font-weight:800;color:var(--accent);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.spin{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 38px;font-size:17px;font-weight:800;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .15s}
.spin:hover:not(:disabled){transform:translateY(-1px)}
.spin:active:not(:disabled){transform:scale(.97)}
.spin:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 18px;font-weight:600;color:var(--muted)}
.sec:hover:not(:disabled){color:var(--text);border-color:var(--muted)}
.sec:disabled{opacity:.5}
.status{font-size:13px;color:var(--muted)}

/* Entries */
#vNamen{flex-direction:column;gap:16px;max-width:820px;width:100%;margin:0 auto}
h1{margin:0;font-size:28px;letter-spacing:-.03em;font-weight:800}
.add{display:flex;gap:10px}
.add input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.add input:focus{outline:2px solid var(--accent);border-color:transparent}
.add button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 22px;font-weight:800}
.ai{display:flex;flex-direction:column;gap:12px}
.aih{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.aih .spark{color:var(--accent);font-size:18px}
.aih small{color:var(--muted)}
.ai textarea{width:100%;resize:vertical;min-height:64px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 16px;line-height:1.45}
.ai textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.prev{display:flex;flex-wrap:wrap;gap:8px}
.prev:empty{display:none}
.chip.dup{opacity:.5}
.chip.dup span::after{content:" · schon vorhanden";font-size:12px;font-weight:400}
.go{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 22px;font-weight:800}
.go:disabled{opacity:.45;cursor:not-allowed}
.tg{display:flex;align-items:center;gap:14px;cursor:pointer;font-weight:600}
.tg input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg input:checked{background:var(--accent)}
.tg input:checked::after{transform:translateX(18px)}
.tg small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.tg.sm{font-size:13px;color:var(--muted)}
.fsb{position:absolute;top:14px;right:16px;z-index:3;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:grid;place-items:center;padding:0}
.fsb:hover{color:var(--text);border-color:var(--muted)}
.fsb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.fsm aside{display:none}
body.fsm .fsb svg{transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:120px;flex:1;overflow:auto}
.chip{display:flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:999px;padding:3px 4px 3px 14px;font-weight:600;height:36px}
.chip.h{background:var(--panel2);color:var(--muted);text-decoration:line-through}
.chip button{background:none;border:0;border-radius:50%;width:28px;height:28px;color:var(--muted);font-size:14px;display:grid;place-items:center}
.chip button:hover{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
.chip button.x:hover{color:var(--danger)}
.empty{margin:auto;color:var(--muted);text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .sec.d{color:var(--danger)}

@media (max-width:760px){
  body{flex-direction:column}
  aside{width:100%;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;gap:0;overflow:visible;flex:none}
  aside .spacer,.brand,.cur{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px}
  .nav button{flex:1;flex-direction:column;gap:3px;padding:8px 6px;font-size:12px;align-items:center;text-align:center}
  .nav button em{display:none}
  .view{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="brand"><i></i>Glücksrad</div>
  <nav class="nav" id="nav">
    <button data-v="vRad" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>Glücksrad</button>
    <button data-v="vNamen"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14c2 .7 3.5 2.6 3.5 6"/></svg>Namen<em id="cN">0</em></button>
    <button data-v="vListen"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>Listen<em id="cL">1</em></button>
    <button data-v="vSet"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Einstellungen</button>
  </nav>
  <div class="spacer"></div>
  <div class="cur"><small>Aktive Liste</small><b id="curL"></b></div>
</aside>

<main>
  <section class="view" id="vNamen">
    <div>
      <h1>Namen</h1>
      <p class="sub">Liste „<span id="listName"></span>“ · <button id="toLists">Liste wechseln</button></p>
    </div>
    <div class="card ai">
      <div class="aih"><span class="spark">✦</span><b>Smart-Eingabe</b><small>Einfach einfügen – Vor- und Nachnamen werden automatisch getrennt.</small></div>
      <textarea id="addIn" rows="2" placeholder="z. B. Max Mustermann Anna Schmidt Tom Weber" autocomplete="off" aria-label="Namen eingeben"></textarea>
      <div class="prev" id="prev" aria-live="polite"></div>
      <button class="go" id="addBtn" disabled>Hinzufügen</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="sec" id="b1">Alle einblenden</button>
      <button class="sec" id="b2">Neue Runde</button>
      <button class="sec d" id="b3">Alle löschen</button>
    </div>
  </section>

  <section class="view" id="vListen">
    <div><h1>Listen</h1><p class="sub">Wähle eine Liste für das Rad oder lege eine neue an.</p></div>
    <div class="cards" id="listCards"></div>
  </section>

  <section class="view" id="vSet">
    <h1>Einstellungen</h1>
    <div class="card">
      <h3>Akzentfarbe</h3>
      <div class="sw" id="sw"></div>
    </div>
    <div class="card">
      <div class="dur"><h3 style="margin:0">Drehdauer</h3><b id="durL">6 s</b></div>
      <input type="range" id="dur" min="1" max="120" step="1" aria-label="Drehdauer in Sekunden">
      <p class="hint" id="durH"></p>
    </div>
    <div class="card">
      <h3>Ziehen</h3>
      <label class="tg"><input type="checkbox" class="autoT"><span>Gezogene automatisch ausblenden<small>Der gezogene Name verschwindet nach dem Dreh aus dem Rad. Ausgeschaltet bleibt er im Rad.</small></span></label>
    </div>
  </section>

  <section class="view on" id="vRad">
    <button class="fsb" id="fsb" title="Vollbild" aria-label="Vollbild"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="stage"><canvas id="cv" aria-label="Glücksrad"></canvas><div class="win" id="win" title="Zum Schließen tippen"></div></div>
    <div class="bar">
      <button class="spin" id="spin">Rad drehen</button>
      <button class="sec" id="rnd">Neue Runde</button>
    </div>
    <div class="status" id="status"></div>
    <label class="tg sm"><input type="checkbox" class="autoT"><span>Gezogene automatisch ausblenden</span></label>
  </section>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s), TAU=Math.PI*2;
const SWATCHES=["#6366f1","#0ea5e9","#10b981","#f59e0b","#f43f5e","#a855f7","#14b8a6","#f97316"];
const KEY="gluecksrad-v2";

/* ---------- State ---------- */
let S={lists:{"Startliste":[]},active:"Startliste",dur:6,accent:SWATCHES[0],autoHide:true,view:"vRad",draft:""};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.lists&&Object.keys(r.lists).length)S={...S,...r};}catch(e){}
if(!S.lists[S.active])S.active=Object.keys(S.lists)[0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const entries=()=>S.lists[S.active];
const visible=()=>entries().map((e,i)=>({...e,i})).filter(e=>!e.hidden);

let angle=0,spinning=false,raf=0,winT=0;
$("#win").onclick=()=>{$("#win").innerHTML=""};

/* ---------- Accent ---------- */
function hexRGB(h){h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2;let h=0,s=0;
  if(M!==m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return[h,s*100,l*100]}
function applyAccent(){
  const c=S.accent,[r,g,b]=hexRGB(c),lum=(.299*r+.587*g+.114*b)/255;
  document.documentElement.style.setProperty("--accent",c);
  document.documentElement.style.setProperty("--accent-ink",lum>.65?"#111":"#fff");
  document.querySelectorAll("#sw button").forEach(b=>b.classList.toggle("on",b.dataset.c===c));
  draw();
}
const sw=$("#sw");
SWATCHES.forEach(c=>{const b=document.createElement("button");b.style.setProperty("--c",c);b.dataset.c=c;b.setAttribute("aria-label","Akzent "+c);
  b.onclick=()=>{S.accent=c;save();applyAccent()};sw.append(b)});
const lab=document.createElement("label");lab.title="Eigene Farbe";
lab.innerHTML='<input type="color" aria-label="Eigene Farbe">';sw.append(lab);
lab.firstChild.value=S.accent;
lab.firstChild.oninput=e=>{S.accent=e.target.value;save();applyAccent()};

/* ---------- Wheel drawing ---------- */
const cv=$("#cv"),ctx=cv.getContext("2d");
const dark=()=>matchMedia("(prefers-color-scheme:dark)").matches;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function resize(){
  const d=Math.min(devicePixelRatio||1,3),w=cv.clientWidth;
  if(!w)return;
  cv.width=cv.height=Math.round(w*d);draw();
}
new ResizeObserver(resize).observe(cv);

function sliceColor(i,n,h0,s0){
  const hue=(h0+i*(360/n))%360, d=dark();
  const l=(d?50:54)+((i%2)?4:-2);
  return`hsl(${hue.toFixed(0)} ${Math.max(55,Math.min(s0,80))}% ${l}%)`;
}
function draw(){
  const W=cv.width;if(!W)return;
  const c=W/2,R=c*.91,vis=visible(),n=vis.length;
  ctx.clearRect(0,0,W,W);
  const [h0,s0]=rgb2hsl(hexRGB(S.accent));
  const k=W/600;

  // shadow + rim
  ctx.save();
  ctx.shadowColor=dark()?"rgba(0,0,0,.6)":"rgba(20,22,40,.22)";ctx.shadowBlur=14*k;ctx.shadowOffsetY=5*k;
  ctx.beginPath();ctx.arc(c,c,R+8*k,0,TAU);ctx.fillStyle=css("--panel");ctx.fill();ctx.restore();

  if(!n){
    ctx.beginPath();ctx.arc(c,c,R,0,TAU);ctx.fillStyle=css("--panel2");ctx.fill();
    ctx.fillStyle=css("--muted");ctx.font=`600 ${22*k}px Manrope,system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("Keine Einträge",c,c+R*.35);
  } else {
    const s=TAU/n;
    for(let i=0;i<n;i++){
      const a0=angle+i*s-Math.PI/2,a1=a0+s;
      ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,R,a0,a1);ctx.closePath();
      const col=n===1?sliceColor(0,1,h0,s0):sliceColor(i,n,h0,s0);
      const g=ctx.createRadialGradient(c,c,R*.1,c,c,R);
      g.addColorStop(0,col);g.addColorStop(1,col);
      ctx.fillStyle=col;ctx.fill();
      // soft inner shading
      const sh=ctx.createRadialGradient(c,c,R*.2,c,c,R);
      sh.addColorStop(0,"rgba(255,255,255,.14)");sh.addColorStop(.7,"rgba(255,255,255,0)");sh.addColorStop(1,"rgba(0,0,0,.14)");
      ctx.fillStyle=sh;ctx.fill();
      if(n>1){ctx.lineWidth=2*k;ctx.strokeStyle=css("--panel");ctx.stroke();}
    }
    // labels
    const hubR=R*.17, maxW=R-hubR-R*.16;
    for(let i=0;i<n;i++){
      const mid=angle+(i+.5)*s-Math.PI/2;
      ctx.save();ctx.translate(c,c);ctx.rotate(mid);
      const arcH=2*R*.55*Math.sin(Math.min(s,Math.PI)/2);
      let fs=Math.max(11*k,Math.min(26*k,arcH*.42,R*.11));
      ctx.font=`800 ${fs}px Manrope,system-ui,sans-serif`;
      let t=vis[i].name;
      while(ctx.measureText(t).width>maxW&&fs>10*k){fs*=.92;ctx.font=`800 ${fs}px Manrope,system-ui,sans-serif`}
      if(ctx.measureText(t).width>maxW){while(t.length>2&&ctx.measureText(t+"…").width>maxW)t=t.slice(0,-1);t+="…"}
      ctx.textAlign="right";ctx.textBaseline="middle";
      ctx.fillStyle="#fff";ctx.shadowColor="rgba(0,0,0,.3)";ctx.shadowBlur=4*k;
      ctx.fillText(t,R-R*.08,0);
      ctx.restore();
    }
    // outer ring + ticks
    ctx.beginPath();ctx.arc(c,c,R,0,TAU);ctx.lineWidth=4*k;ctx.strokeStyle=css("--panel");ctx.stroke();
  }
  // hub
  ctx.save();ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=14*k;ctx.shadowOffsetY=3*k;
  ctx.beginPath();ctx.arc(c,c,R*.15,0,TAU);ctx.fillStyle=css("--panel");ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(c,c,R*.095,0,TAU);ctx.fillStyle=S.accent;ctx.fill();
  // pointer
  ctx.save();ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=10*k;ctx.shadowOffsetY=3*k;
  const top=c-R-14*k;
  ctx.beginPath();ctx.moveTo(c-17*k,top);ctx.lineTo(c+17*k,top);ctx.lineTo(c,top+50*k);ctx.closePath();
  ctx.fillStyle=css("--text");ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(c,top+9*k,4*k,0,TAU);ctx.fillStyle=S.accent;ctx.fill();
}
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);

/* ---------- Spin ---------- */
// Geschwindigkeitsverlauf: schneller Start, langes Ausrollen, aber nie langsamer als VEND (Rad bleibt sichtbar in Bewegung).
const VEND=0.22, V0=16;           // rad/s: Mindest-Kriechtempo (~13°/s) und Starttempo
function spin(){
  const vis=visible();
  if(spinning||!vis.length)return;
  spinning=true;$("#win").innerHTML="";updateButtons();
  const n=vis.length,s=TAU/n,pos=Math.floor(Math.random()*n);
  const T=Math.max(1,S.dur);                 // Sekunden
  const tau=Math.min(1,T*.08), T1=T-tau;     // Hauptphase + sanftes Abstoppen am Ende
  const p=2+T/12;                            // je länger, desto stärker das Abbremsen
  const jitter=(Math.random()-.5)*s*.7;
  const goal=((-(pos+.5)*s+jitter)%TAU+TAU)%TAU;
  const delta=(((goal-angle)%TAU)+TAU)%TAU;
  const base=VEND*(T1+tau/2);
  const want=base+(V0-VEND)*T1/(p+1);
  const rot=Math.max(1,Math.round((want-delta)/TAU));
  const total=rot*TAU+delta;
  const v0=VEND+(total-base)*(p+1)/T1;       // Starttempo, damit genau total erreicht wird
  const A=(v0-VEND)*T1/(p+1);
  const P1=t=>VEND*t+A*(1-Math.pow(1-t/T1,p+1));
  const E1=P1(T1);
  const pos_t=t=>{if(t<=T1)return P1(t);const u=t-T1;return E1+VEND*u-VEND*u*u/(2*tau)};
  const a0=angle,t0=performance.now();
  const frame=now=>{
    const t=Math.min((now-t0)/1000,T);
    angle=a0+pos_t(t);draw();
    if(t<T){raf=requestAnimationFrame(frame)}
    else{angle=a0+total;finish(vis[pos])}
  };
  raf=requestAnimationFrame(frame);
}
function finish(w){
  angle%=TAU;draw();
  $("#win").innerHTML='<small>Gezogen</small><strong></strong>';
  $("#win strong").textContent=w.name;
  clearTimeout(winT);winT=setTimeout(()=>{$("#win").innerHTML=""},4500);
  setTimeout(()=>{
    if(S.autoHide&&entries()[w.i])entries()[w.i].hidden=true;
    save();spinning=false;draw();renderAll();
  },1000);
}

/* ---------- Lists UI ---------- */
function renderLists(){
  const box=$("#listCards");box.innerHTML="";
  Object.keys(S.lists).forEach(name=>{
    const l=S.lists[name],v=l.filter(e=>!e.hidden).length;
    const d=document.createElement("div");d.className="lc"+(name===S.active?" on":"");
    d.tabIndex=0;d.setAttribute("role","button");
    const pick=()=>{if(spinning)return;S.active=name;save();$("#win").innerHTML="";renderAll()};
    d.onclick=pick;d.onkeydown=e=>{if(e.target===d&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick()}};
    const b=document.createElement("b");b.textContent=name;
    const sm=document.createElement("small");sm.textContent=l.length+(l.length===1?" Name":" Namen")+" · "+v+" im Rad";
    const act=document.createElement("div");act.className="act";
    const r=document.createElement("button");r.textContent="Umbenennen";r.onclick=e=>{e.stopPropagation();renameList(name)};
    const x=document.createElement("button");x.className="d";x.textContent="Löschen";x.onclick=e=>{e.stopPropagation();deleteList(name)};
    act.append(r,x);d.append(b,sm,act);
    if(name===S.active){const t=document.createElement("span");t.className="tag";t.textContent="Aktiv";d.append(t)}
    box.append(d);
  });
  const n=document.createElement("button");n.className="newc";n.textContent="+ Neue Liste";n.onclick=newList;box.append(n);
}
function renameList(name){
  if(spinning)return;
  const nn=(prompt("Neuer Name für „"+name+"“:",name)||"").trim();
  if(!nn||nn===name)return;
  if(S.lists[nn]){alert("Diesen Namen gibt es schon.");return}
  const o={};for(const k in S.lists)o[k===name?nn:k]=S.lists[k];S.lists=o;if(S.active===name)S.active=nn;
  save();renderAll();
}
function deleteList(name){
  if(spinning)return;
  if(Object.keys(S.lists).length<2){alert("Es muss mindestens eine Liste vorhanden sein.");return}
  if(!confirm("„"+name+"“ wirklich löschen?"))return;
  delete S.lists[name];if(S.active===name)S.active=Object.keys(S.lists)[0];
  save();renderAll();
}
function newList(){
  if(spinning)return;
  const n=(prompt("Name der neuen Liste:")||"").trim();
  if(!n)return;
  if(S.lists[n]){alert("Diesen Namen gibt es schon.");return}
  S.lists[n]=[];S.active=n;save();renderAll();
}

/* ---------- Entries UI ---------- */
function renderChips(){
  const box=$("#chips");box.innerHTML="";
  const list=entries();
  if(!list.length){box.innerHTML='<div class="empty">Noch keine Einträge.<br>Gib oben Namen ein, getrennt wird automatisch.</div>';return}
  list.forEach((e,i)=>{
    const c=document.createElement("div");c.className="chip"+(e.hidden?" h":"");

    const eye=document.createElement("button");eye.textContent=e.hidden?"👁":"🙈";eye.title=e.hidden?"Wieder einblenden":"Ausblenden";
    eye.onclick=()=>{if(spinning)return;e.hidden=!e.hidden;save();renderAll()};
    const x=document.createElement("button");x.className="x";x.textContent="✕";x.title="Entfernen";
    x.onclick=()=>{if(spinning)return;list.splice(i,1);save();renderAll()};
    c.append(t,eye,x);box.append(c);
  });
}
/* ---------- Smart-Erkennung (lokal, ohne Server) ---------- */
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/ae|oe|ue/g,m=>m[0]);
const FN=new Set(("aaron adam adrian ahmed alan albert alex alexander alexandra alfred ali alina alisa alice amelie amira ana anastasia andre andrea andreas angela angelika anita anja ann anna anne annika anselm anton antonia arne arthur astrid august ayse barbara bastian beate ben benedikt benjamin bernd bernhard bettina birgit bjorn boris brigitte bruno carina carl carla carlo carolin caroline cedric celina charlotte chiara christa christian christiane christin christina christoph claas claudia clemens conrad constantin cornelia dagmar damian daniel daniela dario david denis diana diego dieter dietmar dirk dominik doris eduard edgar elena eleonora elias elif elisa elisabeth ella ellen elli elmar elsa emanuel emil emilia emily emma emre enrico enzo erdem eric erik erika ernst esra eva evelyn fabian fabienne fatma felix felicitas ferdinand fiona florian frank franz franziska frederik frieda friedrich fritz gabriel gabriele georg gerd gerhard gerrit gisela gregor greta gudrun gunnar gunter gustav hakan hanna hannah hannes hans harald hartmut heidi heike heinrich heinz helen helena helene helga hella helmut henning henri henrik henry herbert hermann hilde holger horst hugo ida igor ilka ilse ina inga ingo ingrid irene iris isa isabel isabella ismail ivan jacob jakob jan jana jann janna janine jannik jasmin jason jean jennifer jens jessica jil jill joachim joana joel johann johanna johannes jonas jonathan jorg josef josefine joshua jule julia julian juliane julius jurgen justus kai karen karin karl karla karolin karsten kata katharina kathrin katja katrin kay kerstin kevin kim klara klaus knut konrad konstantin kristin kristina kurt lara larissa lars laura lea lena leni lennard lennart leo leon leona leonard leonie leopold lia liam lilly lina linda lisa lothar louis louisa louise luca lucas luis luisa luise luka lukas lutz maja malte manfred manuel mara marc marcel marco marcus mareike maren margarete margit maria marie marian marianne marina mario marion marius mark marko markus marlene marlon marta martha martin marvin mary mathias matteo matthias matthis max maxi maximilian maya mehmet melanie melina melissa merle mia michael michaela michelle miguel mika mike milan mila miriam mirko mohamed mohammed monika moritz muhammed nadine nadja nathalie nele nick nico nicola nicole nicolas nils nina noah nora norbert norman olaf olga oliver olivia omar oskar otto pascal patrick patricia paul paula paulina pauline peter petra philipp philip pia pierre rafael ralf ralph rebecca regina reinhard renate rene ricarda richard rico rita robert robin roland rolf romy rosa rosemarie rudolf ruth sabine sabrina sandra sandro sara sarah sascha sebastian selina selin sergej sibylle sigrid silke silvia simon simone sina sofia sophia sophie stefan stefanie steffen stella stephan stephanie sven svenja tamara tanja tatjana ted teresa theo theodor theresa thilo thomas tilman tim timo timon tina tobias tom tommy toni tony torsten udo ulf ulla ulli ulrich ulrike uta ute uwe valentin valerie vanessa vera verena veronika viktor viktoria vincent vivian vladimir volker waltraud walter wiebke wilhelm willi wolf wolfgang yannick yara yasmin yusuf yvonne zoe").split(" ").map(nz));
const SN=new Set(("muller schmidt schneider fischer weber meyer meier maier mayer wagner becker schulz hoffmann hofmann schafer koch bauer richter klein wolf schroder neumann schwarz zimmermann braun kruger hartmann lange schmitt werner krause lehmann schmid schulze kohler herrmann konig walter huber kaiser fuchs peters lang scholz moller weiss jung hahn schubert vogel friedrich keller gunther frank berger winkler roth beck lorenz baumann franke albrecht schuster simon ludwig bohm winter kraus martin schumacher kramer vogt stein jager otto sommer gross seidel heinrich brandt haas schreiber graf schulte dietrich ziegler kuhn pohl engel horn busch bergmann thomas voigt sauer arnold wolff pfeiffer mustermann musterfrau").split(" ").map(nz));
const PART=new Set("von van vom zu zur zum de der den di da del della du la le ten ter dos das el al bin ibn".split(" "));
const TITLE=/^(dr|prof|herr|frau|mr|mrs|ms)\.?$/i;
const DA=new Set("anna maria marie hans karl josef johann franz jean mary ana klaus heinz rolf wolf lisa".split(" "));
const DB=new Set("maria marie peter paul josef karl jurgen heinz dieter lena luise louise lotte sophie theresa therese christin christina elisabeth".split(" "));
const SUF=/(mann|berg|stein|bauer|huber|feld|hoff|ski|sky|ovic|ova|sson|sen|ing|ner|ler|mayr)$/;

function info(t){
  const k=nz(t),parts=k.split("-");
  const f=/^[a-z]\.$/.test(k)||FN.has(k)||(parts.length>1&&parts.every(p=>FN.has(p)));
  const s=SN.has(k)||parts.some(p=>SN.has(p))||(!f&&SUF.test(k));
  return{t,k,f,s,p:PART.has(k)&&k.length<=4};
}
function prep(words){
  const out=[];let pre="";
  words.forEach(w=>{
    if(TITLE.test(w)){pre+=(pre?" ":"")+w;return}
    const o=info(w);if(pre){o.t=pre+" "+w;pre=""}out.push(o);
  });
  return out;
}
// Wie plausibel ist es, dass diese Wörter EIN Name sind? (niedriger = besser)
function cost(a){
  const k=a.length,f=a[0],l=a[k-1];
  if(f.p||l.p)return 5;
  if(k===1)return f.f?.7:f.s?1.6:1.2;
  if(k===2){
    if(f.f&&(!l.f||l.s))return 0;
    if(f.f&&l.f)return DA.has(f.k)&&DB.has(l.k)?.8:1.6;
    if(!f.f&&l.s)return .3;
    return .9;
  }
  const m=a.slice(1,-1);
  if(f.f&&m.every(x=>x.p))return .05*k;
  if(k===3){
    if(f.f&&m[0].f&&DA.has(f.k)&&DB.has(m[0].k))return .4;
    if(f.f&&!m[0].f)return 1.4;
    return 2.2;
  }
  if(k===4&&f.f&&m[0].f&&DA.has(f.k)&&m[1].p)return .5;
  return 1.5*k-2;
}
function seg(toks){
  const n=toks.length,best=Array(n+1).fill(1e9),from=Array(n+1).fill(0);best[0]=0;
  for(let i=1;i<=n;i++)for(let j=Math.max(0,i-5);j<i;j++){
    const c=best[j]+cost(toks.slice(j,i));
    if(c<best[i]){best[i]=c;from[i]=j}
  }
  const out=[];for(let i=n;i>0;i=from[i])out.unshift(toks.slice(from[i],i));
  return out;
}
const cap=w=>w.split("-").map(x=>x.length>1&&(x===x.toLowerCase()||x===x.toUpperCase())?x[0].toUpperCase()+x.slice(1).toLowerCase():x).join("-");
const fmt=n=>n.split(" ").map(w=>PART.has(nz(w))&&w===w.toLowerCase()?w:cap(w)).join(" ");
function smartSplit(text){
  const raw=text.split(/[\n\r;,|\/\t•]+|\s+(?:und|&|\+)\s+/i)
    .map(c=>c.replace(/^\s*(?:\d+[.)]|[-*–])\s+/,"").trim()).filter(Boolean);
  let chunks=raw.map(c=>c.split(/\s+/));
  // „Nachname, Vorname“-Listen erkennen
  if(chunks.length>=2&&chunks.length%2===0&&chunks.every(c=>c.length===1)){
    const I=chunks.map(c=>info(c[0]));
    if(I.every((x,i)=>i%2?x.f:!x.f)){
      const sw=[];for(let i=0;i<chunks.length;i+=2)sw.push([chunks[i+1][0],chunks[i][0]]);chunks=sw;
    }
  }
  const multi=chunks.length>1,out=[];
  chunks.forEach(c=>{
    const toks=prep(c);if(!toks.length)return;
    if(multi&&toks.length<=3)out.push(toks.map(x=>x.t).join(" "));
    else seg(toks).forEach(g=>out.push(g.map(x=>x.t).join(" ")));
  });
  return out.map(fmt).filter(Boolean);
}

let pend=[];
function renderPrev(){
  const box=$("#prev");box.innerHTML="";
  const seen=new Set(entries().map(e=>e.name.toLowerCase()));let k=0;
  pend.forEach((nm,i)=>{
    const dup=seen.has(nm.toLowerCase());seen.add(nm.toLowerCase());if(!dup)k++;
    const c=document.createElement("div");c.className="chip"+(dup?" dup":"");
    const t=document.createElement("span");t.textContent=nm;c.append(t);
    if(nm.includes(" ")){const b=document.createElement("button");b.textContent="✂";b.title="In einzelne Wörter trennen";
      b.onclick=()=>{pend.splice(i,1,...nm.split(" "));renderPrev()};c.append(b)}
    if(i<pend.length-1){const b=document.createElement("button");b.textContent="⟷";b.title="Mit dem nächsten Namen verbinden";
      b.onclick=()=>{pend.splice(i,2,nm+" "+pend[i+1]);renderPrev()};c.append(b)}
    box.append(c);
  });
  const g=$("#addBtn");g.disabled=!k;g.textContent=k?k+(k===1?" Name":" Namen")+" hinzufügen":"Hinzufügen";
}
function add(){
  if(spinning)return;
  const have=new Set(entries().map(e=>e.name.toLowerCase()));
  pend.forEach(n=>{const k=n.toLowerCase();if(!have.has(k)){entries().push({name:n,hidden:false});have.add(k)}});
  $("#addIn").value="";S.draft="";pend=[];save();renderAll();$("#addIn").focus();
}
$("#addIn").oninput=e=>{S.draft=e.target.value;save();pend=smartSplit(e.target.value);renderPrev()};
$("#addBtn").onclick=add;
$("#addIn").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();add()}};
const showAll=()=>{if(spinning)return;entries().forEach(e=>e.hidden=false);save();$("#win").innerHTML="";renderAll()};
$("#b1").onclick=$("#b2").onclick=$("#rnd").onclick=showAll;
$("#b3").onclick=()=>{if(spinning)return;if(entries().length&&confirm("Wirklich alle Einträge löschen?")){S.lists[S.active]=[];save();$("#win").innerHTML="";renderAll()}};

/* ---------- Misc UI ---------- */
function updateButtons(){$("#spin").disabled=spinning||!visible().length;$("#spin").textContent=spinning?"Dreht …":"Rad drehen"}
function renderStatus(){
  const t=entries().length,v=visible().length;
  $("#status").textContent=!t?"Keine Einträge vorhanden.":`${v} im Rad`+(t-v?` · ${t-v} ausgeblendet`:"");
}
function renderDur(){
  $("#dur").value=S.dur;$("#durL").textContent=S.dur+" s";
  $("#durH").textContent=S.dur>=30?"Das Rad wird zum Ende hin sehr langsam, dreht aber immer sichtbar weiter.":S.dur>=12?"Langes, spannendes Ausrollen.":"Kurzer Dreh.";
}
$("#dur").oninput=e=>{S.dur=+e.target.value;save();renderDur()};
function renderAll(){
  $("#listName").textContent=S.active;$("#curL").textContent=S.active;document.title="Glücksrad – "+S.active;
  $("#cN").textContent=entries().length;$("#cL").textContent=Object.keys(S.lists).length;
  renderLists();renderChips();renderPrev();renderStatus();updateButtons();draw();
}
$("#spin").onclick=spin;
function go(v){
  S.view=v;save();
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v));
  if(v==="vRad")resize();
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
$("#toLists").onclick=()=>go("vListen");
/* Vollbild nur für die Glücksrad-Seite */
function setFS(on){
  document.body.classList.toggle("fsm",on);
  const el=document.documentElement;
  try{
    if(on&&!document.fullscreenElement&&!document.webkitFullscreenElement){const f=el.requestFullscreen||el.webkitRequestFullscreen;const r=f&&f.call(el);r&&r.catch&&r.catch(()=>{})}
    if(!on&&(document.fullscreenElement||document.webkitFullscreenElement)){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  }catch(e){}
  setTimeout(resize,120);
}
$("#fsb").onclick=()=>setFS(!document.body.classList.contains("fsm"));
["fullscreenchange","webkitfullscreenchange"].forEach(n=>document.addEventListener(n,()=>{
  if(!document.fullscreenElement&&!document.webkitFullscreenElement&&document.body.classList.contains("fsm"))setFS(false);
}));
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&document.body.classList.contains("fsm"))setFS(false);
  if(e.code==="Space"&&$("#vRad").classList.contains("on")&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();spin()}
});

/* ---------- Automatische lokale Speicherung ---------- */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.querySelectorAll(".autoT").forEach(c=>{
  c.checked=S.autoHide;
  c.onchange=()=>{S.autoHide=c.checked;document.querySelectorAll(".autoT").forEach(x=>x.checked=S.autoHide);save()};
});

$("#addIn").value=S.draft||"";pend=smartSplit($("#addIn").value);
renderDur();applyAccent();renderAll();
go(document.getElementById(S.view)?S.view:"vRad");
})();
